name: min-deps

# Standard `min-deps` lane (per
# kaos-modules/docs/oss/40-ci-cd/runner-cost-reduction-plan.md):
# lowest-direct dependency contract. NOT a PR / main-push lane —
# runs weekly, on manual dispatch, and on release tags.

on:
  schedule:
    - cron: "23 5 * * 1"  # Mondays at 05:23 UTC
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: min-deps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  min-deps:
    name: min-deps
    runs-on: kaos-x64-16core
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install with lowest-direct resolution
        run: uv sync --group dev --extra model2vec --resolution=lowest-direct --python 3.13

      - name: Build PyO3 extension
        run: uv run maturin develop --release

      - name: Run tests
        run: uv run pytest -m "not live" --no-cov -q tests/
